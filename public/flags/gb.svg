<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <clipPath id="c"><rect width="60" height="30"/></clipPath>
  <!-- Blue background -->
  <rect width="60" height="30" fill="#012169"/>
  <!-- White diagonals (St Andrew + St Patrick base) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
  <!-- Red diagonals (St Patrick) -->
  <path d="M0,0 L60,30" stroke="#C8102E" stroke-width="4" clip-path="url(#c)"/>
  <path d="M60,0 L0,30" stroke="#C8102E" stroke-width="4" clip-path="url(#c)"/>
  <!-- White cross (St George) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
  <!-- Red cross (St George) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
</svg>
