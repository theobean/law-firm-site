<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 18">
  <!-- Blue background -->
  <rect width="27" height="18" fill="#0D5EAF"/>
  <!-- White stripes -->
  <rect y="2"  width="27" height="2" fill="#fff"/>
  <rect y="6"  width="27" height="2" fill="#fff"/>
  <rect y="10" width="27" height="2" fill="#fff"/>
  <rect y="14" width="27" height="2" fill="#fff"/>
  <!-- Blue canton -->
  <rect width="10" height="10" fill="#0D5EAF"/>
  <!-- White cross in canton -->
  <rect x="3.5" y="0" width="3" height="10" fill="#fff"/>
  <rect x="0"   y="3.5" width="10" height="3" fill="#fff"/>
</svg>
