<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f2c3f"/>
  <!-- beam -->
  <line x1="8" y1="11" x2="24" y2="11" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- center pole -->
  <line x1="16" y1="11" x2="16" y2="24" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- base -->
  <line x1="12" y1="24" x2="20" y2="24" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- left chain -->
  <line x1="8" y1="11" x2="8" y2="17" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round"/>
  <!-- right chain -->
  <line x1="24" y1="11" x2="24" y2="17" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round"/>
  <!-- left pan -->
  <path d="M5 17 Q8 20 11 17" stroke="#c9a84c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- right pan -->
  <path d="M21 17 Q24 20 27 17" stroke="#c9a84c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- top center dot -->
  <circle cx="16" cy="10" r="1.2" fill="#c9a84c"/>
</svg>
